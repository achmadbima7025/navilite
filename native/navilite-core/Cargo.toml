[package]
name = "navilite-core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1"

[build-dependencies]
csbindgen = "1.9.8"
